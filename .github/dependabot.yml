# Руководство по стилю, п. 3.5: еженедельные сгруппированные обновления зависимостей.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: dev_any
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: dev_any
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev_any
