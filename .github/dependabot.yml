# Еженедельные предложения обновлений зависимостей, см. docs/STYLE_GUIDE.md, раздел 3.5
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      antd:
        patterns:
          - antd
          - '@ant-design/*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
